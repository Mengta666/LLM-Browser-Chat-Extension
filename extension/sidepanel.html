<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 顶部导航栏 -->
  <div class="tabs">
    <button class="tab-btn active" data-target="chat">🤖 自动化</button>
    <button class="tab-btn" data-target="settings">⚙️ 设置</button>
  </div>

  <!-- 自动化 Tab：agent 执行 + 截图/图片视觉输入 -->
  <div id="chat" class="tab-content active">
    <div class="chat-header">
      <span class="chat-title">浏览器自动化</span>
      <button id="clearChatBtn" class="clear-btn" title="清空执行记录">🗑️ 清空</button>
    </div>

    <div class="chat-history" id="chatHistory"></div>

    <div class="input-area">
      <div class="composer">
        <textarea id="chatInput" placeholder="输入问题聊天，或点 🤖 自动化 让 agent 操作网页 (Enter发送, Shift+Enter换行)..."></textarea>
        <div class="attachment-toolbar">
          <div class="floating-tip-wrap">
            <button id="uploadImageBtn" class="tool-btn" type="button" title="上传参考图">🖼️ 图片</button>
            <span class="floating-tip" role="tooltip">上传的图片会作为提问或自动化任务的视觉参考</span>
          </div>
          <button id="captureVisibleTabBtn" class="tool-btn" type="button" title="框选当前标签页区域截图">📸 框选截图</button>
          <button id="agentModeBtn" class="tool-btn" type="button" title="开启/关闭浏览器自动化模式">🤖 自动化</button>
          <input id="agentModeToggle" type="checkbox" hidden>
          <button id="clearImageBtn" class="tool-btn secondary" type="button" hidden>移除图片</button>
          <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif,image/jpg" hidden>
        </div>
        <div id="imagePreview" class="image-preview hidden">
          <img id="imagePreviewImg" alt="图片预览">
          <div class="image-preview-meta">
            <div class="image-preview-name" id="imagePreviewName"></div>
            <div class="image-preview-size" id="imagePreviewSize"></div>
          </div>
        </div>
      </div>
      <button id="sendBtn">发送</button>
    </div>
  </div> <!-- 自动化 Tab 结束 -->

  <!-- 设置 Tab -->
  <div id="settings" class="tab-content">
    <label>API Base URL:</label>
    <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1">
    <div class="settings-hint">默认使用 OpenAI。也可以填写可信的 HTTPS OpenAI-compatible API，例如 https://example.com/v1；首次保存会请求该域名权限。</div>

    <label>API Key:</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <div id="apiKeyStatus" class="settings-hint"></div>
    <div class="settings-hint">切换 API 地址时需要重新输入该服务对应的 API Key，避免把旧 Key 发到错误服务。</div>

    <label>模型 (Model):</label>
    <input type="text" id="modelName" placeholder="gpt-4o">

    <button id="saveSettingsBtn">保存配置</button>
    <button id="clearApiKeyBtn" type="button">清除 API Key</button>
    <div id="saveMsg"></div>
  </div>

  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
