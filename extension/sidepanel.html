<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>

<body>
  <!-- 顶部导航栏 -->
  <div class="tabs">
    <button class="tab-btn active" data-target="chat">🤖 自动化</button>
    <button class="tab-btn" data-target="memory">🧠 记忆</button>
    <button class="tab-btn" data-target="settings">⚙️ 设置</button>
  </div>

  <!-- 自动化 Tab：agent 执行 + 截图/图片视觉输入 -->
  <div id="chat" class="tab-content active">
    <div class="chat-header">
      <button id="openSessionsBtn" class="clear-btn" title="会话历史">☰ 会话</button>
      <span class="chat-title">浏览器自动化</span>
      <button id="clearChatBtn" class="clear-btn" title="新建会话/清空">🗑️ 清空</button>
    </div>

    <div class="chat-history" id="chatHistory"></div>

    <div class="input-area">
      <div class="composer">
        <textarea id="chatInput" placeholder="输入问题聊天，或点 🤖 自动化 让 agent 操作网页 (Enter发送, Shift+Enter换行)..."></textarea>
        <div class="attachment-toolbar">
          <div class="floating-tip-wrap">
            <button id="uploadImageBtn" class="tool-btn" type="button" title="上传参考图">🖼️ 图片</button>
            <span class="floating-tip" role="tooltip">上传的图片会作为提问或自动化任务的视觉参考</span>
          </div>
          <button id="captureVisibleTabBtn" class="tool-btn" type="button" title="框选当前标签页区域截图">📸 框选截图</button>
          <button id="webSearchBtn" class="tool-btn" type="button" title="开启/关闭联网搜索模式">🔍 搜索</button>
          <input id="webSearchToggle" type="checkbox" hidden>
          <button id="agentModeBtn" class="tool-btn" type="button" title="开启/关闭浏览器自动化模式">🤖 自动化</button>
          <input id="agentModeToggle" type="checkbox" hidden>
          <button id="clearImageBtn" class="tool-btn secondary" type="button" hidden>移除图片</button>
          <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif,image/jpg" hidden>
        </div>
        <div id="imagePreview" class="image-preview hidden">
          <img id="imagePreviewImg" alt="图片预览">
          <div class="image-preview-meta">
            <div class="image-preview-name" id="imagePreviewName"></div>
            <div class="image-preview-size" id="imagePreviewSize"></div>
          </div>
        </div>
      </div>
      <button id="sendBtn">发送</button>
    </div>
  </div> <!-- 自动化 Tab 结束 -->

  <!-- 设置 Tab -->
  <div id="settings" class="tab-content">
    <label>API Base URL:</label>
    <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1">
    <div class="settings-hint">默认使用 OpenAI。也可以填写可信的 HTTPS OpenAI-compatible API，例如 https://example.com/v1；首次保存会请求该域名权限。</div>

    <label>API Key:</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <div id="apiKeyStatus" class="settings-hint"></div>
    <div class="settings-hint">切换 API 地址时需要重新输入该服务对应的 API Key，避免把旧 Key 发到错误服务。</div>

    <label>模型 (Model):</label>
    <input type="text" id="modelName" placeholder="gpt-4o">

    <button id="saveSettingsBtn">保存配置</button>
    <button id="clearApiKeyBtn" type="button">清除 API Key</button>
    <div id="saveMsg"></div>
  </div>

  <!-- 记忆 Tab(批次 E · P3:独立 tab,与自动化/设置并列)-->
  <div id="memory" class="tab-content">
    <div class="memory-section">
      <div class="memory-head">
        <label>🧠 长期记忆</label>
        <div class="memory-head-btns">
          <button id="rethinkMemoryBtn" class="tool-btn secondary" type="button" title="LLM 整理:找冲突/过期/合并">✨ 整理</button>
          <button id="refreshMemoryBtn" class="tool-btn secondary" type="button" title="刷新">↻ 刷新</button>
        </div>
      </div>
      <div class="settings-hint">Claude 从对话中学到的关于你的长期事实。可删除、编辑或手动添加,下次对话会参考。<strong>点"整理"</strong>会用 LLM 扫全库找冲突/过期条,新覆盖旧。</div>
      <div class="memory-add">
        <input type="text" id="memoryAddInput" placeholder="手动添加一条记忆,如「我偏好用 TypeScript」">
        <button id="memoryAddBtn" class="tool-btn" type="button">添加</button>
      </div>
      <div id="memoryList" class="memory-list"></div>
    </div>

    <!-- 整理进度 modal(rethink SSE) -->
    <div id="rethinkModal" class="rethink-modal" style="display:none">
      <div class="rethink-modal-inner">
        <div class="rethink-modal-title">正在整理长期记忆</div>
        <div id="rethinkModalStatus" class="rethink-modal-status">初始化...</div>
        <div id="rethinkModalLog" class="rethink-modal-log"></div>
        <div class="rethink-modal-actions">
          <button id="rethinkModalCloseBtn" class="tool-btn secondary" type="button" style="display:none">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 会话历史侧滑抽屉 + 遮罩 -->
  <div id="drawerMask" class="drawer-mask hidden"></div>
  <aside id="sessionDrawer" class="side-drawer">
    <div class="side-drawer-head">
      <span class="side-drawer-title">会话历史</span>
      <button id="newSessionBtn" class="tool-btn" type="button" title="新建会话">＋ 新建</button>
      <button id="closeSessionsBtn" class="tool-btn secondary" type="button" title="关闭">✕</button>
    </div>
    <div id="sessionList" class="session-list"></div>
  </aside>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
