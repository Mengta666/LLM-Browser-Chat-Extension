<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>SVG 自动化回归</title>
<style>
  body { margin: 20px; font: 16px sans-serif; min-height: 2600px; }
  .row { margin-bottom: 16px; }
  .iconpark-icon { width: 24px; height: 24px; }
  .pointer { cursor: pointer; }
  #late { margin-top: 1000px; }
  #partial { width: 120px; height: 40px; }
  iframe { width: 300px; height: 160px; border: 4px solid; }
</style>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="plan" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22"/></symbol></defs></svg>
<div class="row"><span id="direct" title="签到"><svg class="iconpark-icon"><use href="#plan"/></svg></span></div>
<div class="row"><span id="pointer" class="pointer" title="指针签到"><svg class="iconpark-icon"><use href="#plan"/></svg></span></div>
<div class="row"><span id="svg-wrapper" title="图标签到"><svg id="svg-only" class="iconpark-icon"><use href="#plan"/></svg></span></div>
<div class="row"><a id="link" title="设置" href="#settings"><svg class="iconpark-icon"><use href="#plan"/></svg></a></div>
<div class="row"><button id="parent" title="父操作"><svg id="independent" aria-label="独立操作" class="iconpark-icon"><use href="#plan"/></svg></button></div>
<div class="row"><span id="hint" title="仅提示">普通说明</span></div>
<div class="row"><button id="disabled" disabled title="禁用"><svg class="iconpark-icon"><use href="#plan"/></svg></button></div>
<div class="row" style="display:none"><span id="hidden" title="隐藏"><svg class="iconpark-icon"><use href="#plan"/></svg></span></div>
<div class="row" style="opacity:0"><span id="transparent" title="透明"><svg class="iconpark-icon"><use href="#plan"/></svg></span></div>
<div class="row"><button id="partial">局部遮挡</button></div>
<div class="row"><input id="checkbox" type="checkbox"><label for="checkbox">异步复选框</label></div>
<div class="row"><iframe id="same-frame" src="/frame"></iframe></div>
<div class="row"><iframe id="cross-frame" src="http://svg-child.test/frame"></iframe></div>
<div id="late"><span id="scrolled" title="滚动签到"><svg class="iconpark-icon"><use href="#plan"/></svg></span></div>
<script>
  window.auditClicks = [];
  for (const id of ['direct', 'pointer', 'svg-only', 'link', 'parent', 'independent', 'hidden', 'transparent', 'partial', 'scrolled']) {
    document.getElementById(id).addEventListener('click', event => {
      if (id === 'independent') event.stopPropagation();
      auditClicks.push({ id, target: event.target.nodeName, trusted: event.isTrusted });
    });
  }
  checkbox.addEventListener('click', event => {
    auditClicks.push({ id: 'checkbox', trusted: event.isTrusted });
    event.preventDefault();
    setTimeout(() => { checkbox.checked = true; }, 150);
  });
  addEventListener('message', event => {
    if (event.data?.auditFrameClick) auditClicks.push(event.data.auditFrameClick);
  });
</script>
</html>
